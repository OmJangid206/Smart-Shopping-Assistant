# Qdrant vector DB for RAG (P2). Start with:  docker compose up -d qdrant
# You only need this once you switch retrieval to real mode (MOCK_MODE=false).
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST/gRPC API
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
